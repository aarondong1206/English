    .side-stack{display:grid;gap:20px;min-width:0}.summary-card{padding:28px}.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}.progress-head strong{font-size:17px;font-weight:600}.progress-head span{color:var(--muted);font-size:15px}.track{height:6px;overflow:hidden;border-radius:99px;background:#e8e8ed}.fill{height:100%;border-radius:inherit;background:var(--blue);transition:width .25s}.small-copy{margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.7}.notice{padding:24px;border-radius:var(--radius);background:#eaeaec;color:var(--muted);font-size:13px;line-height:1.8}.notice b{color:var(--ink);font-weight:600}

<body>
  <header class="topbar"><div class="brand">英语六级 <small>2026.12</small></div><span class="date-chip" id="todayChip"></span></header>
  <main>
    <section class="hero"><div class="hero-copy"><div class="eyebrow">CET-6 / Daily execution · 10月13日晚上开始</div><h1>陌生材料在家学，<br>熟悉材料通勤听。</h1><p>一周一套真题听力，一天一段：晚上在家用 echo 法精听、背3句核心句，第二天早晚开车泛听。听力从2023年3月往新听，最新一套留到12/5自测。</p></div><aside class="exam-card"><div><div class="label">六级笔试</div><strong>12月12日 · 15:00</strong><div class="countdown" id="countdown">计算中</div></div><div><div class="rule"></div><div class="time">目标：稳过425，按470准备｜10/17诊断后按分数选档</div></div></aside></section>
    <section class="kpis"><div class="kpi"><span class="num" id="kpiDays">61</span><span class="label">学习日</span></div><div class="kpi"><span class="num">5</span><span class="label">完整模考</span></div><div class="kpi"><span class="num">8套</span><span class="label">真题听力精听背诵</span></div><div class="kpi"><span class="num">墨墨</span><span class="label">每日不断档</span></div></section>
    <section class="page active" id="page-today"></section><section class="page" id="page-plan"></section><section class="page" id="page-completion"></section>
  </main>
  <nav class="bottom-nav" aria-label="页面导航"><button class="nav active" data-page="today">今日</button><button class="nav" data-page="plan">计划</button><button class="nav" data-page="completion">完成情况</button></nav><div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const ANCHOR = new Date(2026, 9, 12), START = new Date(2026, 9, 13), END = new Date(2026, 11, 11), EXAM = new Date(2026, 11, 12, 15, 0);
    const STORE = 'cet6_study_plan_2026_v6';

    /* ---------- 资料位置：页面只显示“上一级文件夹 / 标题”，完整路径放在悬停提示里 ---------- */
    const ROOT = {
      course:'01【2026】六级全程2班/02 课程/01 视频/',
      courseCompanion:'01【2026】六级全程2班/02 课程/02 伴学/',
      courseCompanion2:'01【2026】六级全程2班/02 课程/02 伴学/新建文件夹/',
      material:'01【2026】六级全程2班/03 资料/',
      listen:'02【活动赠课】四六级听力基础包/02 课程/01 视频/',
      book:'00.书籍扫描/'
    };
    const v = (folder, title) => ({ short:`${folder} / ${title}`, full:`${ROOT.course}${folder}/${title}.mp4` });
    const lv = (folder, title) => ({ short:`${folder} / ${title}`, full:`${ROOT.listen}${folder}/${title}.mp4` });
    const comp = (name) => ({ short:`伴学 / ${name}`, full:`${(parseInt(name,10) <= 5 ? ROOT.courseCompanion : ROOT.courseCompanion2)}${name}/` });
    const mat = (title) => ({ short:`03 资料 / ${title}`, full:`${ROOT.material}${title}` });
    const BOOK = '26英语六级--六级真题随课资料--有道.pdf';
    // 书上印的页码；扫描版PDF的页数 = 书页码 + 3
    const book = (page, what) => ({ short:`00.书籍扫描 / 真题书 p.${page}（PDF第${page+3}页）${what?' · '+what:''}`, full:`${ROOT.book}${BOOK}` });
    const spark = (label) => ({ short:`星火英语 · ${label}`, full:'星火英语 App', spark:true });

    /* ---------- 阶段 ---------- */
    const phases = [
      {id:'foundation',label:'诊断筑底',start:'10/13',end:'10/25',text:'地铁看听力基础包学语音；晚上用 echo 法精听真题听力，从2023年3月开始；10/17诊断模考定档。'},
      {id:'method',label:'方法写译',start:'10/26',end:'11/8',text:'听力、阅读、写作、翻译方法课；11/7第一次真题模考（2024年12月第二套）。'},
      {id:'practice',label:'真题套卷',start:'11/9',end:'12/6',text:'晚上继续按年份精听；地铁看已精听那套的听力讲解和写译讲解；模考用更新的真题，12/5用最新一套自测。'},
      {id:'final',label:'考前收口',start:'12/7',end:'12/11',text:'不开新课、不做新题：背诵复查、回炉最弱段落、写译框架与作息。'}
    ];
    const weekMeta = [
      ['第1周','2023年3月听力 · 诊断模考'],['第2周','2023年6月第一套听力'],['第3周','2023年6月第二套听力 · 听读方法'],['第4周','2023年12月第一套听力 · 写译方法'],
      ['第5周','2023年12月第二套听力'],['第6周','2024年6月第一套听力'],['第7周','2024年6月第二套听力'],
      ['第8周','2024年12月第一套听力 · 最新真题自测'],['第9周','考前收口']
    ];

    /* ---------- 晚间 echo 精听：一周一套真题听力，从旧到新；一天一段 ---------- */
    // 每套都用真题书里的“听力原文与译文”做伴读，用伴学核心句PDF挑背诵句
    const LISTEN_SETS = [
      { label:'2023年3月六级听力真题', page:149, audio:comp('11 听力伴学2023年3月真题第一套音频选项'), core:comp('12 听力伴学2023年3月真题核心句'), lecture:v('03 23年03月真题讲解','01 【听力】2023年3月') },
      { label:'2023年6月六级听力真题（第一套）', page:158, audio:comp('14 听力伴学2023年6月第一套音频选项'), core:comp('13 听力伴学2023年6月第一套核心句'), lecture:v('04 23年06月真题讲解','01 【听力】2023年6月（第一套）欧阳萍直播') },
      { label:'2023年6月六级听力真题（第二套）', page:167, audio:comp('15 听力伴学2023年6月第二套音频选项'), core:comp('16 听力伴学2023年6月第二套核心句'), lecture:v('04 23年06月真题讲解','03 【听力】2023年6月（第二套）欧阳萍直播') },
      { label:'2023年12月六级听力真题（第一套）', page:176, audio:comp('17 听力伴学2023年12月第一套音频选项'), core:comp('19 听力伴学2023年12月第一套核心句'), lecture:v('05 23年12月真题讲解','01 六级【听力】2023年12月（第一套）') },
      { label:'2023年12月六级听力真题（第二套）', page:185, audio:comp('18 听力伴学2023年12月第二套音频选项'), core:comp('20 听力伴学2023年12月第二套核心句'), lecture:v('05 23年12月真题讲解','04 六级【听力】2023年12月（第二套）') },
      { label:'2024年6月六级听力真题（第一套）', page:194, audio:comp('21 六级听力202406-1音频选项'), core:comp('23 六级听力202406-1核心句'), lecture:v('06 24年06月真题讲解','01 【六级听力】2024年06月（第一套）') },
      { label:'2024年6月六级听力真题（第二套）', page:203, audio:comp('22 六级听力202406-2音频选项'), core:comp('24 六级听力202406-2核心句'), lecture:v('06 24年06月真题讲解','03 【六级听力】2024年06月（第二套）') },
      { label:'2024年12月六级听力真题（第一套）', page:212, audio:spark('2024年12月六级听力真题（一）'), core:comp('27 2412六级听力核心句第一套'), lecture:null }
    ];
    const SEGMENTS = {
      1:{ label:'Conversation One', focus:'先抓人物关系、场景和分歧。' },
      2:{ label:'Conversation Two', focus:'留意转折、建议和最终决定。' },
      3:{ label:'Passage One', focus:'抓主题句、事例与结论。' },
      4:{ label:'Passage Two', focus:'抓时间、因果和细节。' },
      5:{ label:'Recording One', focus:'讲座每题约14.2分，先理清主旨和逻辑结构。' },
      6:{ label:'Recording Two', focus:'抓观点、例证和转折。' },
      0:{ label:'Recording Three', focus:'完成本套最后一段。' }
    };
    const CN_NUM=['','一','二','三','四','五','六','七'];
    const ECHO_STEPS = (page, focus) => `${focus}\n① 盲听测试：先做本段题目，只听一遍，记下大概听懂几成。\n② 查词背词：对照真题书 p.${page} 起的原文，生词加入墨墨。\n③ 理解翻译：读右栏译文，确保每句都懂。\n④ 看文本 echo 听读：播一句 → 暂停 → 让声音在脑中回响一两秒 → 模仿读出来。\n⑤ 再盲听全段。④⑤ 循环并逐步加速，直到不看文本也能“飘双语字幕”。\n最后从本段挑3句核心句背下来。`;

    /* ---------- 工作日返程地铁网课：一天一讲 ---------- */
    const COURSE_NOTE = '看不完就在下一个工作日接着看；需要动笔的练习放到周末。';

      const morning=isStart
        ?{id:'audio-morning',kind:'audio',stage:'早上去程开车',title:'启动日：不安排陌生听力',detail:'今天还没有精听过的材料，正常通勤或休息。驾驶中不操作屏幕。',planned:60}
        :{id:'audio-morning',kind:'audio',stage:'早上去程开车',title:`⑥ 泛听昨晚的段落：${prev.short}`,detail:'前20–30分钟完整循环3–5遍，直到一听到句子就能“飘”出意思；可以在心里默念昨晚背的3句。之后换本周更早的段落或休息。驾驶中只听，不看屏幕、不查词。无需用满60分钟。',planned:60};
      const evening=isStart
        ?{id:'audio-evening',kind:'audio',stage:'晚上返程开车',title:'启动日：不安排陌生听力',detail:'陌生材料留到在家后结合文本学习。驾驶中不操作屏幕。',planned:60}
        :{id:'audio-evening',kind:'audio',stage:'晚上返程开车',title:`⑥ 间隔泛听：${prev.short}`,detail:'先完整听1–2遍，检查隔了一天还能不能“飘字幕”；模糊的句子多听几遍，但不在车上分析。剩余时间轮换本周更早的段落。累了或路况复杂就关掉。无需用满60分钟。',planned:60};
      return [
        morning,
        (w===8?{id:'momo-go',kind:'momo',stage:'早上去程地铁',title:'墨墨：只做到期复习和易忘词',detail:'考前一周不再新增单词。',planned:30}:{id:'momo-go',kind:'momo',stage:'早上去程地铁',title:'墨墨：先完成到期复习，再学10–20个新词',detail:'固定约30分钟；优先加入精听时查到的生词；考研学过的词标熟跳过。',planned:30}),
        {id:'course-back',kind:'course',stage:'晚上返程地铁',title:!course.files.length?course.title:`网课：${course.title}`,detail:course.detail,planned:55,files:course.files},
        evening,
        {id:'spark-deep',kind:'audio',stage:'晚上在家',title:today.title,detail:today.detail,planned:w===8?30:40,files:today.files}
      ];
    }

    function weekendTasks(item){
      const w=weekIndex(item.date), isSat=item.date.getDay()===6, L=listening(item.date);
      const desk={id:'spark-desk',kind:'audio',stage:'上午（不驾驶）',title:L.title,detail:L.detail,planned:isSat&&MOCKS[w]?30:40,files:L.files};
      if(isSat){
        const mock=MOCKS[w];
        if(mock) return [
          {id:'momo-week',kind:'momo',stage:'上午',title:'墨墨：到期复习＋本周重点词回顾',detail:'不新增大量单词。',planned:30},
          desk,
          {id:'mock-ready',kind:'deep',stage:'考前准备',title:'模考前轻复习与准备',detail:'只看本周背过的核心句和错题，不刷新题；准备计时器、答题卡和2B铅笔。',planned:20},
          {id:'mock',kind:'deep',stage:'15:00 模考',title:`完整限时模考：${mock.paper}`,detail:`按考场顺序：写作30分钟 → 听力约30分钟（听完立即涂卡）→ 阅读＋翻译共70分钟（仔细阅读 → 长篇阅读 → 选词填空最多8分钟 → 翻译）。${mock.note}`,planned:145,files:mock.files},
          {id:'mock-note',kind:'deep',stage:'考后',title:w===0?'估分并按分数选档':'记录各部分得分与时间问题',detail:w===0?'用答案与解析估出听力、阅读、写译三部分分数，对照今日页“按分数选档”。当天不深度复盘。':'当天不深度复盘，明天再做。',planned:20},
          {id:'words',kind:'vocab',stage:'晚间',title:'整理本周易忘词',detail:'每词只保留一个常用搭配或例句，优先用精听原文里的句子。',planned:15}
        ];
        return [
          {id:'momo-week',kind:'momo',stage:'上午',title:'墨墨：到期复习＋本周重点词回顾',detail:'不新增大量单词。',planned:30},
          desk,
          ...PRACTICE_SATURDAYS[w],
          {id:'words',kind:'vocab',stage:'晚间',title:'整理本周易忘词',detail:'每词只保留一个常用搭配或例句，优先用精听原文里的句子。',planned:15}
        ];
      }
      const S=SUNDAYS[w], si=Math.floor(listenIndex(item.date)/7), set=LISTEN_SETS[si];
      return [
        {id:'momo-test',kind:'momo',stage:'上午',title:'墨墨随机自测20个重点词',detail:'仍不会的继续标记易忘词。',planned:30},
        {id:'review',kind:'deep',stage:'上午',title:S.review,detail:S.reviewDetail||'错因只归入：词汇、理解、定位、技巧、时间、表达。',planned:80,files:S.reviewFiles},
        desk,
        {id:'recite',kind:'deep',stage:'下午',title:`背诵检查：${set.label}`,detail:`像检查古诗一样：先默背本套已学6段的核心句（每段3句），卡住的回看原文；再挑一段最喜欢的整段背下来（建议先从短文开始）。${si>0?'顺便把上一套整段背过的那段再背一次。':''}最后一段明晚学完。`,planned:30,files:[set.core, book(set.page,'听力原文与译文')]},
        {id:S.main.id,kind:'deep',stage:'下午',title:S.main.title,detail:S.main.detail,planned:60,files:S.main.files},
        {id:'trans',kind:'deep',stage:'下午',title:`翻译主题表达：${TRANSLATION_TOPICS[w].replace(/^\d+ 翻译伴学/,'')}`,detail:'把高频表达遮住英文自己译一遍，不会的抄进翻译本。8类主题每周一类，考前刚好过完。',planned:20,files:[comp(TRANSLATION_TOPICS[w])]},
        {id:'vocab',kind:'vocab',stage:'晚间',title:`六级核心词汇 第${w+1}讲`,detail:'看视频，把不认识的词加入墨墨；考研学过的词快速跳过。',planned:25,files:[v('02 六级词汇课',VOCAB_VIDEOS[w]), comp(VOCAB_COMPANIONS[w])]},
        {id:'next-week',kind:'deep',stage:'晚间',title:'确认下周安排',detail:`明晚学完本套最后一段；周二开始${si<LISTEN_SETS.length-1?LISTEN_SETS[si+1].label:'考前回炉'}，把音频和原文页码准备好。`,planned:15}
      ];
    }

    function headline(item){
      const pick=item.tasks.find(t=>t.id==='mock')||item.tasks.find(t=>t.id==='practice')||item.tasks.find(t=>t.id==='review')||item.tasks.find(t=>t.id==='course-back');
      return pick?pick.title:item.tasks[0].title;
    }
    function buildSchedule(){const out=[];for(let d=cloneDate(START);d<=END;d.setDate(d.getDate()+1)){const date=cloneDate(d),weekend=date.getDay()===0||date.getDay()===6,w=weekIndex(date);const item={date,key:localKey(date),week:weekMeta[w][0],weekName:weekMeta[w][1],phase:phaseFor(date),weekend};item.tasks=weekend?weekendTasks(item):weekdayTasks(item);out.push(item);}return out;}
    const schedule=buildSchedule();

    function filesHtml(files){return (files||[]).filter(Boolean).map(f=>`<span class="badge file${f.spark?' spark':''}" title="${esc(f.full)}">${esc(f.short)}</span>`).join('');}
    function taskHtml(task,item){const key=`${item.key}:${task.id}`,done=!!state.completed[key];const spark=task.spark?`<span class="badge file spark">${esc(task.spark)}</span>`:'';return `<article class="task ${done?'done':''}"><div class="task-top"><div class="task-stage">${esc(task.stage)}</div><div class="task-copy"><div class="task-title">${esc(task.title)}</div><div class="task-detail">${esc(task.detail)}</div></div></div><div class="task-meta"><span class="badge">预计 ${task.planned} 分钟</span>${spark}${filesHtml(task.files)}</div><div class="task-actions"><label class="complete-control"><input type="checkbox" data-task-key="${key}" aria-label="${esc(task.title)}：已完成" ${done?'checked':''} onchange="toggleComplete('${key}')"><span>已完成</span></label></div></article>`;}
    function todayItem(){const now=new Date();return now<START?schedule[0]:(schedule.find(x=>x.key===localKey(now))||schedule.at(-1));}
    function renderToday(){const item=todayItem(),completed=item.tasks.filter(t=>state.completed[`${item.key}:${t.id}`]).length,pct=Math.round(completed/item.tasks.length*100);document.getElementById('page-today').innerHTML=`<div class="section-head"><h2>${new Date()<START?'启动日前的准备':'今天的执行清单'}</h2><span>${md(item.date)} · ${weekday(item.date)} · ${item.week}</span></div><div class="today-layout"><div class="card today-card"><div class="today-heading"><strong>${esc(item.phase.label)}</strong><span>${esc(item.weekName)}</span></div><div class="task-list">${item.tasks.map(t=>taskHtml(t,item)).join('')}</div></div><aside class="side-stack"><div class="card summary-card"><div class="progress-head"><strong>今日完成</strong><span>${completed}/${item.tasks.length}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><p class="small-copy">任务以当天安排为准；未完成项仅留在当天记录中，不会添加到之后的计划。</p></div><div class="notice"><b>10/17 诊断后按分数选档</b><br>低于380：保底模式，选词填空只求速度，多补听力基础和写译模板。<br>380–440：按本计划执行。<br>高于440：可以冲500，再加1–2套模考。</div><div class="notice"><b>echo 精听六步（一段材料挖到底）</b><br>① 盲听测试 ② 查词背词 ③ 理解翻译 ④ 看文本 echo 听读 ⑤ 盲听测试；④⑤ 循环加速，直到“飘双语字幕” → ⑥ 第二天开车泛听。<br>echo 不是影子跟读：听完一句先暂停，让声音在脑中回响，再模仿读出。<br>伴读：真题书“听力原文与译文”（英中对照）；背诵：伴学核心句PDF，每段3句。</div><div class="notice"><b>分值提示</b><br>讲座/讲话、仔细阅读：每题约14.2分。<br>长对话、短文、段落匹配：每题约7.1分。<br>选词填空：每题约3.55分，最多给8分钟。</div></aside></div><div class="section-head"><h2>阶段路线</h2><span>听力按年份从旧到新，最新一套留到最后自测</span></div><div class="phase-grid">${phases.map(p=>`<div class="phase"><div class="date">${p.start}–${p.end}</div><h3>${p.label}</h3><p>${p.text}</p></div>`).join('')}</div>`;}
    function renderPlan(){const filtered=scheduleFilter==='all'?schedule:schedule.filter(x=>x.phase.id===scheduleFilter),groups=[];filtered.forEach(item=>{let g=groups.at(-1);if(!g||g.week!==item.week){g={week:item.week,name:item.weekName,items:[]};groups.push(g);}g.items.push(item);});document.getElementById('page-plan').innerHTML=`<div class="section-head"><h2>${schedule.length}天每日计划</h2><span>展开日期，勾选已完成任务</span></div><div class="filters">${[{id:'all',label:'全部'},...phases.map(p=>({id:p.id,label:p.label}))].map(f=>`<button class="filter ${scheduleFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('')}</div>${groups.map(g=>`<section class="week-group"><div class="week-title">${g.week} · ${g.name}<span>${g.items.length}天</span></div>${g.items.map(item=>{const open=expandedDays.has(item.key);return `<article class="card day-card"><button class="day-summary ${open?'open':''}" aria-expanded="${open}" aria-controls="tasks-${item.key}" onclick="toggleDay('${item.key}')"><div class="day-date">${md(item.date)}<small>${weekday(item.date)}</small></div><div class="day-main">${esc(headline(item))}<small>${item.phase.label} · ${item.tasks.length}项任务</small></div><span class="expand" id="exp-${item.key}">${open?'收起':'展开'}</span></button><div class="day-tasks ${open?'open':''}" id="tasks-${item.key}">${item.tasks.map(t=>taskHtml(t,item)).join('')}</div></article>`;}).join('')}</section>`).join('')}`;}
    function completionFor(item){const done=item.tasks.filter(task=>state.completed[`${item.key}:${task.id}`]).length;return {done,total:item.tasks.length,pct:Math.round(done/item.tasks.length*100)};}
    function renderCompletion(){
      const history=schedule.filter(item=>item.date<=cloneDate(new Date())), oldScroll=document.getElementById('page-completion').classList.contains('active')?(document.querySelector('.chart-scroll')?.scrollLeft||completionScrollLeft):completionScrollLeft;
      const selected=history.find(item=>item.key===selectedCompletionDate);
      document.getElementById('page-completion').innerHTML=`<div class="section-head"><h2>完成情况</h2><span>每天的进步，一目了然。</span></div>${history.length?`<section class="card chart-card"><div class="chart-heading"><strong>每日完成率</strong><span>${md(history[0].date)} – ${md(history.at(-1).date)} · 点击日期查看详情</span></div><div class="chart-layout"><div class="chart-axis" aria-hidden="true"><span>100%</span><span>50%</span><span>0%</span></div><div class="chart-scroll" role="group" aria-label="每日完成率图表"><div class="chart-columns">${history.map(item=>{const summary=completionFor(item);return `<button type="button" class="chart-day" data-date="${item.key}" aria-pressed="${item.key===selectedCompletionDate}" aria-label="${item.date.getMonth()+1}月${item.date.getDate()}日，完成率 ${summary.pct}%，${summary.done}/${summary.total} 项已完成" onclick="selectCompletionDate('${item.key}')"><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="--pct:${summary.pct}%"></span></span><span class="bar-label">${md(item.date)}</span><span class="bar-value">${summary.pct}%</span></button>`;}).join('')}</div></div></div></section>`:'<div class="card completion-empty">计划将在 10 月 13 日开始。</div>'}<section class="card completion-detail" id="completion-detail" aria-live="polite">${selected?completionDetail(selected):'<div class="completion-empty">选择一天查看任务完成情况</div>'}</section>`;
      const scroll=document.querySelector('.chart-scroll');if(scroll){scroll.scrollLeft=oldScroll;scroll.addEventListener('scroll',()=>{completionScrollLeft=scroll.scrollLeft;});}
    }
    function completionDetail(item){const summary=completionFor(item);return `<div class="detail-heading"><div><h3>${item.date.getMonth()+1}月${item.date.getDate()}日 · ${weekday(item.date)}</h3><p>${esc(item.phase.label)} · ${esc(item.weekName)}</p></div><div class="completion-count">${summary.done}/${summary.total}<small>已完成 · ${summary.pct}%</small></div></div><div class="completion-tasks">${item.tasks.map(task=>{const done=!!state.completed[`${item.key}:${task.id}`];return `<div class="completion-task ${done?'finished':''}"><span class="completion-mark" aria-hidden="true">${done?'✓':'○'}</span><div>${esc(task.stage)} · ${esc(task.title)}<small>${done?'已完成':'未完成'}</small></div></div>`;}).join('')}</div>`;}
    function selectCompletionDate(key){selectedCompletionDate=key;renderCompletion();document.querySelector(`.chart-day[data-date="${key}"]`)?.focus({preventScroll:true});}
    function revealRecentCompletion(){if(completionVisited)return;const scroll=document.querySelector('.chart-scroll');if(scroll){scroll.scrollLeft=scroll.scrollWidth;completionScrollLeft=scroll.scrollLeft;completionVisited=true;}}
    function renderAll(){renderToday();renderPlan();renderCompletion();}
    function toggleDay(key){const box=document.getElementById(`tasks-${key}`),button=box?.previousElementSibling,exp=document.getElementById(`exp-${key}`);if(!box)return;const open=box.classList.toggle('open');if(open)expandedDays.add(key);else expandedDays.delete(key);button?.classList.toggle('open',open);button?.setAttribute('aria-expanded',String(open));if(exp)exp.textContent=open?'收起':'展开';}
    function setFilter(id){scheduleFilter=id;renderPlan();}
    function toggleComplete(key){
      const active=document.activeElement, page=active?.closest('.page')?.id;
      state.completed[key]=!state.completed[key];if(!state.completed[key])delete state.completed[key];saveState();renderAll();
      if(page)document.getElementById(page)?.querySelector(`[data-task-key="${key}"]`)?.focus({preventScroll:true});
      toast(state.completed[key]?'已完成':'已取消完成');
    }
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1500);}
    function init(){const now=new Date();document.getElementById('todayChip').textContent=`${now.getMonth()+1}月${now.getDate()}日`;const left=Math.max(0,Math.ceil((EXAM-now)/86400000));document.getElementById('countdown').textContent=left?`距离考试还有 ${left} 天`:'今天就是考试日';document.getElementById('kpiDays').textContent=schedule.length;document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(`page-${btn.dataset.page}`).classList.add('active');if(btn.dataset.page==='completion')revealRecentCompletion();}));renderAll();}
    init();
  </script>
</body>
</html>
