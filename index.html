 听读 ⑤ 盲听测试；④⑤ 循环加速，直到“飘双语字幕” → ⑥ 第二天开车泛听。<br>echo 不是影子跟读：听完一句先暂停，让声音在脑中回响，再模仿读出。<br>伴读：真题书“听力原文与译文”（英中对照）；背诵：伴学核心句PDF，每段3句。","<b>分值提示<\/b><br>讲座/讲话、仔细阅读：每题约14.2分。<br>长对话、短文、段落匹配：每题约7.1分。<br>选词填空：每题约3.55分，最多给8分钟。"],"phaseTitle":"阶段路线","phaseSub":"听力按年份从旧到新，最新一套留到最后自测","defaultFilter":"all"};
    const STORE = D.store;
    function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
    function localKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
    function cloneDate(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
    function md(d){return `${d.getMonth()+1}/${d.getDate()}`;}
    function weekday(d){return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];}
    function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));}
    const schedule = D.days.map(x => ({...x, date: parseKey(x.key)}));
    const byKey = new Map(schedule.map(x => [x.key, x]));
    function phaseOf(id){return D.phases.find(p => p.id === id) || {label:'', id:''};}

    function normaliseState(raw){return {completed:raw?.completed && typeof raw.completed==='object' && !Array.isArray(raw.completed)?raw.completed:{}};}
    function loadState(){try{return normaliseState(JSON.parse(localStorage.getItem(STORE)));}catch{return normaliseState({});}}
    function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{}}

    function todayInfo(){
      const now = cloneDate(new Date()), k = localKey(now);
      if (byKey.has(k)) return {item: byKey.get(k), mode: 'today'};
      if (now < schedule[0].date) return {item: schedule[0], mode: 'before'};
      const next = schedule.find(x => x.date > now);
      if (next) return {item: next, mode: 'next'};
      return {item: schedule.at(-1), mode: 'after'};
    }
    let state = loadState(), selectedCompletionDate = null, completionVisited = false, completionScrollLeft = 0;
    let scheduleFilter = D.defaultFilter === 'current' ? (todayInfo().item.phase || 'all') : 'all';
    const expandedDays = new Set([localKey(new Date())]);

    function headline(item){return item.headline || item.tasks[0].title;}
    function filesHtml(files){return (files||[]).filter(Boolean).map(f => f.href
      ? `<a class="badge file" href="${esc(f.href)}" target="_blank" rel="noopener" title="${esc(f.full||f.href)}">${esc(f.short)}</a>`
      : `<span class="badge file${f.spark?' spark':''}" title="${esc(f.full||f.short)}">${esc(f.short)}</span>`).join('');}
    function taskHtml(task,item){
      const key=`${item.key}:${task.id}`, done=!!state.completed[key];
      const tag = task.tag ? `<span class="kind-tag">${esc(task.tag)}</span>` : '';
      return `<article class="task ${done?'done':''}"><div class="task-top"><div class="task-stage">${esc(task.stage)}</div><div class="task-copy"><div class="task-title">${tag}${esc(task.title)}</div>${task.detail?`<div class="task-detail">${esc(task.detail)}</div>`:''}</div></div><div class="task-meta">${task.planned?`<span class="badge">预计 ${task.planned} 分钟</span>`:''}${filesHtml(task.files)}</div><div class="task-actions"><label class="complete-control"><input type="checkbox" data-task-key="${key}" aria-label="${esc(task.title)}：已完成" ${done?'checked':''} onchange="toggleComplete('${key}')"><span>已完成</span></label></div></article>`;
    }
    function renderToday(){
      const {item, mode} = todayInfo();
      const completed = item.tasks.filter(t => state.completed[`${item.key}:${t.id}`]).length, pct = Math.round(completed/item.tasks.length*100);
      const title = mode==='today' ? '今天的执行清单' : mode==='before' ? '启动日前的准备' : mode==='next' ? '今天没有安排' : '计划已结束';
      const hint = mode==='next' ? `<p class="next-hint">${esc(D.emptyToday || '今天没有排任务。')}下面是下一个安排日 ${md(item.date)}（${weekday(item.date)}）的内容，可以提前看看。</p>` : '';
      const ph = phaseOf(item.phase);
      document.getElementById('page-today').innerHTML = `<div class="section-head"><h2>${title}</h2><span>${md(item.date)} · ${weekday(item.date)} · ${esc(item.week)}</span></div><div class="today-layout"><div class="card today-card"><div class="today-heading"><strong>${esc(ph.label)}</strong><span>${esc(item.weekName||'')}</span></div>${hint}<div class="task-list">${item.tasks.map(t=>taskHtml(t,item)).join('')}</div></div><aside class="side-stack"><div class="card summary-card"><div class="progress-head"><strong>${mode==='today'?'今日完成':'当天完成'}</strong><span>${completed}/${item.tasks.length}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><p class="small-copy">${esc(D.summaryNote||'任务以当天安排为准；未完成项仅留在当天记录中，不会添加到之后的计划。')}</p></div>${(D.notices||[]).map(n=>`<div class="notice">${n}</div>`).join('')}</aside></div><div class="section-head"><h2>${esc(D.phaseTitle||'阶段路线')}</h2><span>${esc(D.phaseSub||'')}</span></div><div class="phase-grid">${D.phases.map(p=>`<div class="phase"><div class="date">${esc(p.start)}–${esc(p.end)}</div><h3>${esc(p.label)}</h3><p>${esc(p.text)}</p></div>`).join('')}</div>`;
    }
    function renderPlan(){
      const filtered = scheduleFilter==='all' ? schedule : schedule.filter(x => x.phase===scheduleFilter), groups=[];
      filtered.forEach(item => {let g=groups.at(-1); if(!g||g.week!==item.week){g={week:item.week,name:item.weekName,items:[]};groups.push(g);} g.items.push(item);});
      const total = schedule.length;
      document.getElementById('page-plan').innerHTML = `<div class="section-head"><h2>${total}个安排日</h2><span>${esc(D.planSub||'展开日期，勾选已完成任务')}</span></div><div class="filters">${[{id:'all',label:'全部'},...D.phases.map(p=>({id:p.id,label:p.label}))].map(f=>`<button class="filter ${scheduleFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${esc(f.label)}</button>`).join('')}</div>${groups.map(g=>`<section class="week-group"><div class="week-title">${esc(g.week)}${g.name?' · '+esc(g.name):''}<span>${g.items.length}天</span></div>${g.items.map(item=>{const open=expandedDays.has(item.key);return `<article class="card day-card"><button class="day-summary ${open?'open':''}" aria-expanded="${open}" aria-controls="tasks-${item.key}" onclick="toggleDay('${item.key}')"><div class="day-date">${md(item.date)}<small>${weekday(item.date)}</small></div><div class="day-main">${esc(headline(item))}<small>${esc(phaseOf(item.phase).label)} · ${item.tasks.length}项任务</small></div><span class="expand" id="exp-${item.key}">${open?'收起':'展开'}</span></button><div class="day-tasks ${open?'open':''}" id="tasks-${item.key}">${open?item.tasks.map(t=>taskHtml(t,item)).join(''):''}</div></article>`;}).join('')}</section>`).join('')}`;
    }
    function completionFor(item){const done=item.tasks.filter(task=>state.completed[`${item.key}:${task.id}`]).length;return {done,total:item.tasks.length,pct:Math.round(done/item.tasks.length*100)};}
    function renderCompletion(){
      const today = cloneDate(new Date());
      const history = schedule.filter(item => item.date <= today);
      const pageActive = document.getElementById('page-completion').classList.contains('active');
      const oldScroll = pageActive ? (document.querySelector('.chart-scroll')?.scrollLeft || completionScrollLeft) : completionScrollLeft;
      const selected = history.find(item => item.key===selectedCompletionDate);
      document.getElementById('page-completion').innerHTML = `<div class="section-head"><h2>完成情况</h2><span>每天的进步，一目了然。</span></div>${history.length?`<section class="card chart-card"><div class="chart-heading"><strong>每日完成率</strong><span>${md(history[0].date)} – ${md(history.at(-1).date)} · 点击日期查看详情</span></div><div class="chart-layout"><div class="chart-axis" aria-hidden="true"><span>100%</span><span>50%</span><span>0%</span></div><div class="chart-scroll" role="group" aria-label="每日完成率图表"><div class="chart-columns">${history.map(item=>{const s=completionFor(item);return `<button type="button" class="chart-day" data-date="${item.key}" aria-pressed="${item.key===selectedCompletionDate}" aria-label="${item.date.getMonth()+1}月${item.date.getDate()}日，完成率 ${s.pct}%，${s.done}/${s.total} 项已完成" onclick="selectCompletionDate('${item.key}')"><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="--pct:${s.pct}%"></span></span><span class="bar-label">${md(item.date)}</span><span class="bar-value">${s.pct}%</span></button>`;}).join('')}</div></div></div></section>`:`<div class="card completion-empty">计划将在 ${md(schedule[0].date)} 开始。</div>`}<section class="card completion-detail" id="completion-detail" aria-live="polite">${selected?completionDetail(selected):'<div class="completion-empty">选择一天查看任务完成情况</div>'}</section>`;
      const scroll = document.querySelector('.chart-scroll');
      if (scroll) { scroll.scrollLeft = oldScroll; scroll.addEventListener('scroll', () => { completionScrollLeft = scroll.scrollLeft; }); }
    }
    function completionDetail(item){const s=completionFor(item);return `<div class="detail-heading"><div><h3>${item.date.getMonth()+1}月${item.date.getDate()}日 · ${weekday(item.date)}</h3><p>${esc(phaseOf(item.phase).label)} · ${esc(item.weekName||item.week)}</p></div><div class="completion-count">${s.done}/${s.total}<small>已完成 · ${s.pct}%</small></div></div><div class="completion-tasks">${item.tasks.map(task=>{const done=!!state.completed[`${item.key}:${task.id}`];return `<div class="completion-task ${done?'finished':''}"><span class="completion-mark" aria-hidden="true">${done?'✓':'○'}</span><div>${esc(task.stage)} · ${esc(task.title)}<small>${done?'已完成':'未完成'}</small></div></div>`;}).join('')}</div>`;}
    function selectCompletionDate(key){selectedCompletionDate=key;renderCompletion();document.querySelector(`.chart-day[data-date="${key}"]`)?.focus({preventScroll:true});}
    function revealRecentCompletion(){if(completionVisited)return;const scroll=document.querySelector('.chart-scroll');if(scroll){scroll.scrollLeft=scroll.scrollWidth;completionScrollLeft=scroll.scrollLeft;completionVisited=true;}}
    function renderAll(){renderToday();renderPlan();renderCompletion();}
    function toggleDay(key){
      const box=document.getElementById(`tasks-${key}`), button=box?.previousElementSibling, exp=document.getElementById(`exp-${key}`); if(!box) return;
      const open=box.classList.toggle('open');
      if(open){expandedDays.add(key); const item=byKey.get(key); box.innerHTML=item.tasks.map(t=>taskHtml(t,item)).join('');} else expandedDays.delete(key);
      button?.classList.toggle('open',open); button?.setAttribute('aria-expanded',String(open)); if(exp) exp.textContent=open?'收起':'展开';
    }
    function setFilter(id){scheduleFilter=id;renderPlan();}
    function toggleComplete(key){
      const active=document.activeElement, page=active?.closest('.page')?.id;
      if(window.__readonly){ toast('只读查看：只有看板主人可以打卡'); renderAll(); return; } const was=!!state.completed[key]; if(window.__persist) window.__persist(key,!was); state.completed[key]=!was; if(!state.completed[key]) delete state.completed[key]; saveState(); renderAll();
      if(page) document.getElementById(page)?.querySelector(`[data-task-key="${key}"]`)?.focus({preventScroll:true});
      toast(state.completed[key]?'已完成':'已取消完成');
    }
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1500);}
    function init(){
      const now=new Date();
      document.getElementById('todayChip').textContent=`${now.getMonth()+1}月${now.getDate()}日`;
      const cd=document.getElementById('countdown');
      if (D.target && D.target.iso) { const t=new Date(D.target.iso); const left=Math.max(0,Math.ceil((cloneDate(t)-cloneDate(now))/86400000)); cd.textContent = left ? `距离${D.target.name}还有 ${left} 天` : (now < t ? `今天就是${D.target.name}` : `${D.target.name}已结束`); }
      else cd.textContent = (D.target && D.target.text) || '';
      const kd=document.getElementById('kpiDays'); if(kd) kd.textContent=schedule.length;
      document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(`page-${btn.dataset.page}`).classList.add('active');if(btn.dataset.page==='completion')revealRecentCompletion();window.scrollTo({top:0});}));
      renderAll();
    }
    init();

  </script>
