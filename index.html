      const morning=isStart
        ?{id:'audio-morning',kind:'audio',stage:'早上去程开车',title:'启动日：不安排陌生听力',detail:'今天还没有前一晚精听过的材料，正常通勤或休息；今晚在家从 Conversation One 开始。驾驶中不操作屏幕。无需用满 60 分钟。',planned:60}
        :{id:'audio-morning',kind:'audio',stage:'早上去程开车',title:`集中磨昨晚材料：${previousSegment.label}`,detail:'前20–30分钟完整循环3–5遍，目标是从借助文本听懂过渡到不看文本也能听出来；顺畅后切换更早的熟悉材料或休息。驾驶中只听音频，不看屏幕、查词、记笔记或出声跟读。无需用满 60 分钟。',planned:60,spark:previousLabel};
      const evening=isStart
        ?{id:'audio-evening',kind:'audio',stage:'晚上返程开车',title:'启动日：不安排陌生听力',detail:'返程不预听今晚的新材料，正常通勤或休息；陌生材料留到在家后结合文本学习。驾驶中不操作屏幕。无需用满 60 分钟。',planned:60}
        :{id:'audio-evening',kind:'audio',stage:'晚上返程开车',title:`间隔复听昨晚材料：${previousSegment.label}`,detail:'先完整听1–2遍，检查间隔一天后是否仍能听清；有模糊句可多听几遍，但不在车上分析。剩余时间轮换本周更早学过的段落或休息。驾驶中只听音频，不看屏幕、查词、记笔记或出声跟读。无需用满 60 分钟。',planned:60,spark:previousLabel};
      return [
        morning,
        {id:'momo-go',kind:'momo',stage:'早上去程地铁',title:'墨墨：先完成到期复习，再学10–20个新词',detail:'固定约30分钟；当天复习量过大时只完成到期复习，不强制新增。',planned:30},
        {id:'course-back',kind:'course',stage:'晚上返程地铁',title:courseTask(item.date),detail:'观看约55分钟或接续上次进度；只看讲解并理解方法。标有“作业”的视频，以及需要动笔或刷题的内容统一留到周六。',planned:55,path:coursePath(item.date)},
        evening,
        {id:'spark-deep',kind:'audio',stage:'晚上在家',title:`首次精听今日第${['','一','二','三','四','五','六','七'][sparkSegmentOrder(item.date)]}段：${segment.label}`,detail:'先不看文本盲听一次；再对照文本逐句确认听漏、生词、连读、弱读和发音；跟读重点句；最后关闭文本完整复听并口头概括主旨。这段材料用于明天早晚两次开车复听。',planned:30,spark:label}
      ];
    }
    function weekendTasks(item){const isSat=item.date.getDay()===6, w=weekIndex(item.date);if(isSat&&w===1)return [
      {id:'momo-week',kind:'momo',stage:'上午',title:'墨墨：到期复习＋本周重点词回顾',detail:'不新增大量单词。',planned:30},
      {id:'spark-desk',kind:'audio',stage:'上午20分钟（不驾驶）',title:`精听今日第六段：${sparkSegment(item.date).label}`,detail:sparkDeskDetail(item.date),planned:20,spark:sparkLabel(item.date)},
      {id:'mock-ready',kind:'deep',stage:'考前准备',title:'首次诊断模考前轻复习与准备',detail:'只看核心句和错题，不刷新题。',planned:20,path:coursePath(item.date)},
      {id:'mock',kind:'deep',stage:'15:00模考',title:'首次完整诊断模考',detail:'严格按六级时间完成整套题；当天只记录分数和时间问题。',planned:145,path:coursePath(item.date)},
      {id:'words',kind:'vocab',stage:'晚间',title:'整理本周易忘词',detail:'每词只保留一个常用搭配或例句。',planned:15}
    ];if(isSat&&w>=4&&w<=8)return [
      {id:'momo-week',kind:'momo',stage:'上午',title:'墨墨：到期复习＋本周重点词回顾',detail:'不新增大量单词。',planned:30},
      {id:'spark-desk',kind:'audio',stage:'上午20分钟（不驾驶）',title:`精听今日第六段：${sparkSegment(item.date).label}`,detail:sparkDeskDetail(item.date),planned:20,spark:sparkLabel(item.date)},
      {id:'mock-ready',kind:'deep',stage:'考前准备',title:'模考前轻复习与准备',detail:'只看核心句和错题，不刷新题。',planned:20,path:coursePath(item.date)},
      {id:'mock',kind:'deep',stage:'15:00模考',title:'完整限时模考',detail:'严格按六级时间完成整套题。',planned:145,path:coursePath(item.date)},
      {id:'mock-note',kind:'deep',stage:'考后',title:'记录分数与时间问题',detail:'当天不深度复盘。',planned:20},
      {id:'words',kind:'vocab',stage:'晚间',title:'整理本周易忘词',detail:'每词只保留一个常用搭配或例句。',planned:15}
    ];if(isSat)return [
      {id:'momo-week',kind:'momo',stage:'上午',title:'墨墨：到期复习＋本周重点词回顾',detail:'不新增大量单词。',planned:30},
      {id:'spark-desk',kind:'audio',stage:'上午20分钟（不驾驶）',title:`精听今日第六段：${sparkSegment(item.date).label}`,detail:sparkDeskDetail(item.date),planned:20,spark:sparkLabel(item.date)},
      {id:'integrated',kind:'deep',stage:'上午',title:'本周网课作业：集中完成需动笔内容',detail:'集中完成本周课程中的作文、翻译、阅读题或课后练习；完成题目后再查看对应讲解。',planned:90,path:coursePath(item.date)},
      {id:'practice',kind:'deep',stage:'下午',title:w===0?'15:00完整诊断模考':'分项实战训练或补完本周作业',detail:w===0?'只记录分数和感受。':'完成听力、阅读或写译组合训练；上午未完成的课程作业在这里收尾。',planned:w===0?145:90,path:coursePath(item.date)},
      {id:'words',kind:'vocab',stage:'晚间',title:'整理本周易忘词',detail:'每词保留一个搭配或例句。',planned:15}
    ];return [
      {id:'momo-test',kind:'momo',stage:'上午',title:'墨墨随机自测20个重点词',detail:'仍不会的继续标记易忘词。',planned:30},
      {id:'review',kind:'deep',stage:'上午',title:'逐题复盘与错因归类',detail:'只分为词汇、理解、定位、技巧、时间或表达。',planned:95,path:coursePath(item.date)},
      {id:'spark-desk',kind:'audio',stage:'上午25分钟（不驾驶）',title:`精听今日第七段：${sparkSegment(item.date).label}`,detail:sparkDeskDetail(item.date),planned:25,spark:sparkLabel(item.date)},
      {id:'weakness',kind:'deep',stage:'下午',title:'错因专项训练或对应课程回看',detail:'围绕本次模考最突出的两项短板训练。',planned:75,path:coursePath(item.date)},
      {id:'next-week',kind:'deep',stage:'晚间',title:'预排下周固定任务',detail:'只确认下周的主任务与资料，历史未完成任务不会加入下周。',planned:20},
      {id:'words',kind:'vocab',stage:'晚间',title:'易忘词主动回忆',detail:'回忆词义、读音和搭配。',planned:15}
    ];}
    function buildSchedule(){const out=[];for(let d=cloneDate(START);d<=END;d.setDate(d.getDate()+1)){const date=cloneDate(d),workSaturday=date.getFullYear()===2026&&date.getMonth()===9&&date.getDate()===10,weekend=(date.getDay()===0||date.getDay()===6)&&!workSaturday,w=weekIndex(date);const item={date,key:localKey(date),week:weekMeta[w][0],weekName:weekMeta[w][1],phase:phaseFor(date),weekend};item.tasks=weekend?weekendTasks(item):weekdayTasks(item);out.push(item);}return out;}
    const schedule=buildSchedule(), taskByKey=new Map();schedule.forEach(item=>item.tasks.forEach(task=>taskByKey.set(`${item.key}:${task.id}`,{...task,date:item.date,dateKey:item.key})));
    function taskHtml(task,item){const key=`${item.key}:${task.id}`,done=!!state.completed[key];const resource=task.link?`<a class="source-link" target="_blank" rel="noopener noreferrer" href="${esc(task.link.url)}">${esc(task.link.label)} ↗</a>`:'';const spark=task.spark?`<span class="badge path" title="${esc(task.spark)}">${esc(task.spark)}</span>`:'';const path=task.path?`<span class="badge path" title="${esc(task.path)}">本地路径：${esc(task.path)}</span>`:'';return `<article class="task ${done?'done':''}"><div class="task-top"><div class="task-stage">${esc(task.stage)}</div><div class="task-copy"><div class="task-title">${esc(task.title)}</div><div class="task-detail">${esc(task.detail)}</div></div></div><div class="task-meta"><span class="badge">预计 ${task.planned} 分钟</span>${resource}${spark}${path}</div><div class="task-actions"><label class="complete-control"><input type="checkbox" data-task-key="${key}" aria-label="${esc(task.title)}：已完成" ${done?'checked':''} onchange="toggleComplete('${key}')"><span>已完成</span></label></div></article>`;}
    function todayItem(){const now=new Date();return now<START?schedule[0]:(schedule.find(x=>x.key===localKey(now))||schedule.at(-1));}
    function renderToday(){const item=todayItem(),completed=item.tasks.filter(t=>state.completed[`${item.key}:${t.id}`]).length,pct=Math.round(completed/item.tasks.length*100);document.getElementById('page-today').innerHTML=`<div class="section-head"><h2>${new Date()<START?'启动日前的准备':'今天的执行清单'}</h2><span>${md(item.date)} · ${weekday(item.date)} · ${item.week}</span></div><div class="today-layout"><div class="card today-card"><div class="today-heading"><strong>${esc(item.phase.label)}</strong><span>${esc(item.weekName)}</span></div><div class="task-list">${item.tasks.map(t=>taskHtml(t,item)).join('')}</div></div><aside class="side-stack"><div class="card summary-card"><div class="progress-head"><strong>今日完成</strong><span>${completed}/${item.tasks.length}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><p class="small-copy">任务以当天安排为准；未完成项仅留在当天记录中，不会添加到之后的计划。</p></div><div class="notice"><b>一段听力，跨一天完成</b><br>今晚在家精听新段落 → 明早开车集中复听 → 明晚开车间隔检测。陌生材料不在驾驶时首次学习。</div></aside></div><div class="section-head"><h2>阶段路线</h2><span>课程搭框架，真题负责检验</span></div><div class="phase-grid">${phases.map(p=>`<div class="phase"><div class="date">${p.start}–${p.end}</div><h3>${p.label}</h3><p>${p.text}</p></div>`).join('')}</div>`;}
    function renderPlan(){const filtered=scheduleFilter==='all'?schedule:schedule.filter(x=>x.phase.id===scheduleFilter),groups=[];filtered.forEach(item=>{let g=groups.at(-1);if(!g||g.week!==item.week){g={week:item.week,name:item.weekName,items:[]};groups.push(g);}g.items.push(item);});document.getElementById('page-plan').innerHTML=`<div class="section-head"><h2>65天每日计划</h2><span>展开日期，勾选已完成任务</span></div><div class="filters">${[{id:'all',label:'全部'},...phases.map(p=>({id:p.id,label:p.label}))].map(f=>`<button class="filter ${scheduleFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('')}</div>${groups.map((g,gi)=>`<section class="week-group"><div class="week-title">${g.week} · ${g.name}<span>${g.items.length}天</span></div>${g.items.map((item,i)=>{const open=expandedDays.has(item.key);return `<article class="card day-card"><button class="day-summary ${open?'open':''}" aria-expanded="${open}" aria-controls="tasks-${item.key}" onclick="toggleDay('${item.key}')"><div class="day-date">${md(item.date)}<small>${weekday(item.date)}</small></div><div class="day-main">${esc(item.tasks.find(t=>['spark-deep','mock','integrated','review'].includes(t.id))?.title||item.tasks[0].title)}<small>${item.phase.label} · ${item.tasks.length}项任务</small></div><span class="expand" id="exp-${item.key}">${open?'收起':'展开'}</span></button><div class="day-tasks ${open?'open':''}" id="tasks-${item.key}">${item.tasks.map(t=>taskHtml(t,item,true)).join('')}</div></article>`;}).join('')}</section>`).join('')}`;}
    function completionFor(item){const done=item.tasks.filter(task=>state.completed[`${item.key}:${task.id}`]).length;return {done,total:item.tasks.length,pct:Math.round(done/item.tasks.length*100)};}
    function renderCompletion(){
      const history=schedule.filter(item=>item.date<=cloneDate(new Date())), oldScroll=document.getElementById('page-completion').classList.contains('active')?(document.querySelector('.chart-scroll')?.scrollLeft||completionScrollLeft):completionScrollLeft;
      const selected=history.find(item=>item.key===selectedCompletionDate);
      document.getElementById('page-completion').innerHTML=`<div class="section-head"><h2>完成情况</h2><span>每天的进步，一目了然。</span></div>${history.length?`<section class="card chart-card"><div class="chart-heading"><strong>每日完成率</strong><span>${md(history[0].date)} – ${md(history.at(-1).date)} · 点击日期查看详情</span></div><div class="chart-layout"><div class="chart-axis" aria-hidden="true"><span>100%</span><span>50%</span><span>0%</span></div><div class="chart-scroll" role="group" aria-label="每日完成率图表"><div class="chart-columns">${history.map(item=>{const summary=completionFor(item);return `<button type="button" class="chart-day" data-date="${item.key}" aria-pressed="${item.key===selectedCompletionDate}" aria-label="${item.date.getMonth()+1}月${item.date.getDate()}日，完成率 ${summary.pct}%，${summary.done}/${summary.total} 项已完成" onclick="selectCompletionDate('${item.key}')"><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="--pct:${summary.pct}%"></span></span><span class="bar-label">${md(item.date)}</span><span class="bar-value">${summary.pct}%</span></button>`;}).join('')}</div></div></div></section>`:'<div class="card completion-empty">计划将在 10 月 8 日开始。</div>'}<section class="card completion-detail" id="completion-detail" aria-live="polite">${selected?completionDetail(selected):'<div class="completion-empty">选择一天查看任务完成情况</div>'}</section>`;
      const scroll=document.querySelector('.chart-scroll');if(scroll){scroll.scrollLeft=oldScroll;scroll.addEventListener('scroll',()=>{completionScrollLeft=scroll.scrollLeft;});}
    }
    function completionDetail(item){const summary=completionFor(item);return `<div class="detail-heading"><div><h3>${item.date.getMonth()+1}月${item.date.getDate()}日 · ${weekday(item.date)}</h3><p>${esc(item.phase.label)} · ${esc(item.weekName)}</p></div><div class="completion-count">${summary.done}/${summary.total}<small>已完成 · ${summary.pct}%</small></div></div><div class="completion-tasks">${item.tasks.map(task=>{const done=!!state.completed[`${item.key}:${task.id}`];return `<div class="completion-task ${done?'finished':''}"><span class="completion-mark" aria-hidden="true">${done?'✓':'○'}</span><div>${esc(task.stage)} · ${esc(task.title)}<small>${done?'已完成':'未完成'}</small></div></div>`;}).join('')}</div>`;}
    function selectCompletionDate(key){selectedCompletionDate=key;renderCompletion();document.querySelector(`.chart-day[data-date="${key}"]`)?.focus({preventScroll:true});}
    function revealRecentCompletion(){if(completionVisited)return;const scroll=document.querySelector('.chart-scroll');if(scroll){scroll.scrollLeft=scroll.scrollWidth;completionScrollLeft=scroll.scrollLeft;completionVisited=true;}}
    function renderAll(){renderToday();renderPlan();renderCompletion();}
    function toggleDay(key){const box=document.getElementById(`tasks-${key}`),button=box?.previousElementSibling,exp=document.getElementById(`exp-${key}`);if(!box)return;const open=box.classList.toggle('open');if(open)expandedDays.add(key);else expandedDays.delete(key);button?.classList.toggle('open',open);button?.setAttribute('aria-expanded',String(open));if(exp)exp.textContent=open?'收起':'展开';}
    function setFilter(id){scheduleFilter=id;renderPlan();}
    function toggleComplete(key){
      const active=document.activeElement, page=active?.closest('.page')?.id;
      state.completed[key]=!state.completed[key];if(!state.completed[key])delete state.completed[key];saveState();renderAll();
      if(page)document.getElementById(page)?.querySelector(`[data-task-key="${key}"]`)?.focus({preventScroll:true});
      toast(state.completed[key]?'已完成':'已取消完成');
    }
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1500);}
    function init(){const now=new Date();document.getElementById('todayChip').textContent=`${now.getMonth()+1}月${now.getDate()}日`;document.getElementById('countdown').textContent=Math.max(0,Math.ceil((EXAM-now)/86400000))?`距离考试还有 ${Math.max(0,Math.ceil((EXAM-now)/86400000))} 天`:'今天就是考试日';document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(`page-${btn.dataset.page}`).classList.add('active');if(btn.dataset.page==='completion')revealRecentCompletion();}));renderAll();}
    init();
  </script>
</body>
